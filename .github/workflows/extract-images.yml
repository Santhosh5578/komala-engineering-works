name: Extract uploaded image archive
on:
  push:
    branches: [main]
    paths:
      - 'iLoveZIP_Create.zip'
      - '.github/workflows/extract-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract images into public/images
        run: |
          mkdir -p public/images
          unzip -oq iLoveZIP_Create.zip -d /tmp/komala-assets
          find /tmp/komala-assets -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp -f {} public/images/ \;
          echo 'Extracted files:'
          find public/images -maxdepth 1 -type f -printf '%f\n'
          test "$(find public/images -maxdepth 1 -type f | wc -l)" -gt 0
      - name: Commit extracted assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/images
          git diff --cached --quiet || git commit -m 'Add extracted product and factory images'
          git push
